name: Setup
description: >-
  pnpm, Node from .nvmrc, dependencies, and optionally the compiled paraglide
  messages restored from cache or compiled. Runs after checkout.

inputs:
  paraglide:
    description: Restore or compile the paraglide messages (needed by typed lint and the host test projects)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The compiled messages are a pure function of these inputs, so a cache
    # keyed on them stands in for the 37 s compile.
    - name: Restore compiled paraglide
      if: inputs.paraglide == 'true'
      id: paraglide
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          packages/shared/src/paraglide
          packages/client/src/lib/paraglide
        key: paraglide-${{ hashFiles('pnpm-lock.yaml', 'packages/shared/messages/*.json', 'packages/shared/project.inlang/**', 'packages/client/project.inlang/**', 'packages/shared/scripts/compile-paraglide.js', 'packages/shared/scripts/generate-pseudolocale.js', 'packages/client/scripts/compile-paraglide.js') }}

    - name: Compile paraglide
      if: inputs.paraglide == 'true' && steps.paraglide.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @care-y/shared run build:paraglide && pnpm --filter @care-y/client run build:paraglide
