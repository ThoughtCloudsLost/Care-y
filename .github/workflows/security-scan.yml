name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0" # Sunday 04:17 UTC (off-minute to avoid load spikes)
  workflow_dispatch:
    inputs:
      skip-docker:
        description: Skip the Docker image scan (faster)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # SARIF upload to GitHub Security tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sast:
    name: SAST (Semgrep custom rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run CARE-Y custom rules
        run: semgrep scan --quiet --metrics=off --config .semgrep/care-y-rules.yaml packages/*/src/

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    name: Dependency vulnerabilities (Trivy filesystem)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Upload filesystem SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  docker:
    name: Container vulnerabilities (Trivy image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' && !(github.event.inputs.skip-docker == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build test image
        run: docker build --target test --tag care-y-test:scan .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: care-y-test:scan
          format: sarif
          output: trivy-image.sarif
          severity: MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
