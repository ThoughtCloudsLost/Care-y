name: Demo build

# The path list is repeated rather than shared through a YAML anchor,
# because the workflow parser does not expand anchors.
on:
  # No branch filter. The demo bundles packages/server and packages/client
  # source, so a change anywhere in the paths below can break it, and stacked
  # feature branches are where that happens most. Restricting this to PRs
  # into main meant a branch based on another feature branch never ran it.
  pull_request:
    paths:
      - packages/demo/**
      - packages/client/src/**
      - packages/client/static/**
      - packages/shared/**
      - packages/crypto/src/**
      - packages/server/src/**
      - pnpm-lock.yaml
      - .github/workflows/demo-build.yml
  # Also on push, so a break is reported against the commit that caused
  # it. Running on pull requests alone meant anything reaching main by
  # another route stayed invisible until the next unrelated pull request
  # inherited the failure and appeared to have caused it.
  push:
    branches: [main]
    paths:
      - packages/demo/**
      - packages/client/src/**
      - packages/client/static/**
      - packages/shared/**
      - packages/crypto/src/**
      - packages/server/src/**
      - pnpm-lock.yaml
      - .github/workflows/demo-build.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile shared paraglide
        run: pnpm --filter @care-y/shared run build:paraglide

      - name: Build demo
        run: pnpm --filter @care-y/demo run build

      - name: Verify built demo assets
        run: node packages/demo/scripts/verify-dist.mjs
