version: 2

updates:
  # All npm dependencies (pnpm workspace uses a single root lockfile).
  # Two groups: at most 2 PRs per week instead of one per package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - ThoughtCloudsLost
    groups:
      production-deps:
        dependency-type: "production"
      dev-deps:
        dependency-type: "development"

  # GitHub Actions (single group for all actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    reviewers:
      - ThoughtCloudsLost
    groups:
      github-actions:
        patterns:
          - "*"
