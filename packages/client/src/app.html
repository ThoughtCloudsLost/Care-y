<!doctype html>
<!--
  The %carey.* placeholders are substituted server-side, per org, before
  the document reaches the browser. Org identity therefore paints on the
  first frame without anything being written to the device, which matters
  on a surface whose whole design assumes the device may be looked at by
  someone the person is hiding from.
-->
<html
  lang="%paraglide.lang%"
  dir="%paraglide.dir%"
  style="%carey.brandStyle%"
  data-org-name="%carey.orgName%"
  data-safe-exit-url="%carey.safeExitUrl%"
>
  <head>
    <meta charset="utf-8" />
    <title>CARE-Y</title>
    <!-- maximum-scale=1 + user-scalable=no suppress mobile browser zoom
         entirely, matching native app behavior: no auto-zoom on input
         focus (the sub-16px font-size trigger) and no pinch zoom. This
         trades away WCAG 1.4.4 (resize text) by design; iOS Dynamic Type
         scaling (font: -apple-system-body in shared.css) remains the
         supported text-size path. Note iOS Safari still permits pinch
         zoom as an accessibility override regardless of these values. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- The per-org manifest (name, icons, scope "/"). Without this link an
         installed iOS web app is a plain bookmark: it takes its scope from
         the page it was added on, so adding it at /login puts browser
         chrome on every other page. Same-origin, so CSP default-src 'self'
         covers it (manifest-src falls back to default-src). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1713" id="theme-color" />
    <!-- Splash styles load as a stylesheet, not an inline <style>: SvelteKit
         only adds the style nonce to the CSP header when it inlines CSS
         itself (dev), so a nonce'd inline block is blocked in production.
         Render-blocking in the head so the splash paints styled on the
         first frame. -->
    <link rel="stylesheet" href="/styles/splash.css" />
    <!-- Preload the latin subsets of the two Inkwell faces (body + display).
         crossorigin is required on font preloads even same-origin; without it
         the browser fetches the font twice (preload in anonymous CORS mode,
         @font-face in credentialed mode never matches the cache entry). -->
    <link
      rel="preload"
      href="/fonts/AtkinsonHyperlegibleNext-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Whole-element placeholder rather than a bare href: an empty
         href would make the browser request this page as an icon. It sits
         above the script below, which checks for it before appending its
         own. -->
    %carey.touchIcon%
    <script nonce="%sveltekit.nonce%">
      // Blocking theme init: reads class preferences from localStorage
      // and applies them to <html> before first paint. CSS theme files
      // provide all color values; this script only sets classes.
      // Keys must stay in sync with theme.svelte.ts.
      (function () {
        var d = document.documentElement;
        try {
          var s = localStorage;
          var scheme = s.getItem("care-y-color-scheme") || "dark";
          if (scheme === "system") {
            scheme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (scheme !== "dark" && scheme !== "light") scheme = "dark";
          d.classList.add(scheme);
          var validVisual = {
            default: 1,
            riso: 1,
            frutiger: 1,
            brutalist: 1,
            cupertino: 1,
            prism: 1,
          };
          var visual = s.getItem("care-y-visual-theme") || "default";
          if (!validVisual[visual]) visual = "default";
          d.classList.add("theme-" + visual);
          var glass = s.getItem("care-y-glass-mode") || "auto";
          if (glass !== "auto" && glass !== "light" && glass !== "dark")
            glass = "auto";
          var ge = glass === "auto" ? scheme : glass;
          d.classList.add("glass-" + ge);
        } catch (e) {
          d.classList.add("dark", "theme-default", "glass-dark");
        }
        var cs = d.classList.contains("dark") ? "dark" : "light";
        d.style.colorScheme = cs;
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) m.setAttribute("content", cs);
        // Org identity is injected server-side via the %carey.*% placeholders.
        // No localStorage branding cache: writing which organization was
        // contacted to a client device creates a record that can be read
        // by whoever the person is hiding from.
        var injectedName = d.getAttribute("data-org-name") || "";
        if (injectedName) document.title = injectedName;
        function revealLogo(el) {
          if (el.complete && el.naturalWidth > 0) {
            el.classList.add("visible");
            return;
          }
          el.onload = function () {
            el.classList.add("visible");
          };
        }
        // rAF fires after DOM is built but before first paint
        requestAnimationFrame(function () {
          var logoEl = document.getElementById("splash-logo");
          if (!logoEl) return;
          // A server-injected src starts loading during parse, so it can
          // already be decoded by this frame and never fire onload.
          if (logoEl.getAttribute("src")) {
            revealLogo(logoEl);
          }
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash" aria-hidden="true">
      <!-- Whole-attribute placeholder: an empty src would make the browser
           request this page as an image. -->
      <img
        id="splash-logo"
        alt=""
        width="96"
        height="96"
        %carey.splashLogoSrc%
      />
      <span id="splash-name">%carey.splashName%</span>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
