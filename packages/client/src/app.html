<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
  <head>
    <meta charset="utf-8" />
    <title>CARE-Y</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- Preload the latin subsets of the two Ledger faces (body + display).
         crossorigin is required on font preloads even same-origin; without it
         the browser fetches the font twice (preload in anonymous CORS mode,
         @font-face in credentialed mode never matches the cache entry). -->
    <link
      rel="preload"
      href="/fonts/AtkinsonHyperlegible-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script nonce="%sveltekit.nonce%">
      // Blocking theme init: reads class preferences from localStorage
      // and applies them to <html> before first paint. CSS theme files
      // provide all color values; this script only sets classes.
      // Keys must stay in sync with theme.svelte.ts.
      (function () {
        var d = document.documentElement;
        try {
          var s = localStorage;
          var scheme = s.getItem("care-y-color-scheme") || "dark";
          if (scheme === "system") {
            scheme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (scheme !== "dark" && scheme !== "light") scheme = "dark";
          d.classList.add(scheme);
          var validVisual = {
            default: 1,
            riso: 1,
            frutiger: 1,
            brutalist: 1,
            cupertino: 1,
            prism: 1,
          };
          var visual = s.getItem("care-y-visual-theme") || "default";
          if (!validVisual[visual]) visual = "default";
          d.classList.add("theme-" + visual);
          var glass = s.getItem("care-y-glass-mode") || "auto";
          if (glass !== "auto" && glass !== "light" && glass !== "dark")
            glass = "auto";
          var ge = glass === "auto" ? scheme : glass;
          d.classList.add("glass-" + ge);
        } catch (e) {
          d.classList.add("dark", "theme-default", "glass-dark");
        }
        var cs = d.classList.contains("dark") ? "dark" : "light";
        d.style.colorScheme = cs;
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) m.setAttribute("content", cs);
        // Hydrate brand colors from localStorage (instant, no FOUC).
        // The branding module writes these on save; app.html reads them before paint.
        var bp = s.getItem("care-y-brand-primary");
        if (bp) {
          d.style.setProperty("--brand-primary", bp);
          // Konsta uses rgb() format for --k-color-primary
          var hex = bp.replace("#", "");
          if (hex.length === 3)
            hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
          var r = parseInt(hex.substring(0, 2), 16);
          var g = parseInt(hex.substring(2, 4), 16);
          var b = parseInt(hex.substring(4, 6), 16);
          if (!isNaN(r))
            d.style.setProperty(
              "--k-color-primary",
              "rgb(" + r + " " + g + " " + b + ")",
            );
        }
        var ba = s.getItem("care-y-brand-accent");
        if (ba) d.style.setProperty("--brand-accent", ba);
        var bts = Number(s.getItem("care-y-brand-ts") || "0");
        var fresh = Date.now() - bts < 300000;
        var bn = fresh ? s.getItem("care-y-brand-name") : null;
        if (bn) document.title = bn;
        var bslug = fresh ? s.getItem("care-y-brand-slug") : null;
        var bicons = fresh ? s.getItem("care-y-brand-has-icons") : null;
        var biv = fresh ? s.getItem("care-y-brand-icon-v") : null;
        function iconUrl(slug, size) {
          var u = "/api/branding/" + slug + "/icon-" + size + ".png";
          return biv ? u + "?v=" + biv : u;
        }
        // rAF fires after DOM is built but before first paint
        requestAnimationFrame(function () {
          if (bn) {
            var nameEl = document.getElementById("splash-name");
            if (nameEl) nameEl.textContent = bn;
          }
          var logoEl = document.getElementById("splash-logo");
          if (logoEl && bslug && bicons) {
            logoEl.onload = function () {
              logoEl.classList.add("visible");
            };
            logoEl.src = iconUrl(bslug, "192");
          }
        });
        if (bslug && bicons) {
          var link = document.createElement("link");
          link.rel = "apple-touch-icon";
          link.setAttribute("sizes", "180x180");
          link.href = iconUrl(bslug, "192");
          document.head.appendChild(link);
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <style nonce="%sveltekit.nonce%">
      /* --- Base splash (shared across all themes) --- */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 400ms ease-out;
      }
      #splash-logo {
        width: 96px;
        height: 96px;
        opacity: 0;
        transition: opacity 300ms ease;
      }
      #splash-logo.visible {
        opacity: 1;
      }
      #splash-name {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-top: 16px;
      }
      body.hydrated #splash {
        opacity: 0;
        pointer-events: none;
      }

      /* --- Default text color by scheme --- */
      .light #splash-name {
        color: rgba(0, 0, 0, 0.8);
      }
      .dark #splash-name {
        color: rgba(255, 255, 255, 0.85);
      }

      /* --- Default theme (Ledger) ---
         Splash backgrounds must match the --paper values in
         styles/themes/default.css or the handoff from splash to
         first paint visibly flashes. */
      .theme-default.light #splash {
        background: #f5f1e8;
      }
      .theme-default.dark #splash {
        background: #1a1713;
      }
      .theme-default #splash-logo {
        border-radius: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }

      /* --- Riso theme --- */
      .theme-riso.light #splash {
        background: color-mix(
          in oklch,
          #f0ece5 85%,
          var(--brand-primary, #636366) 15%
        );
      }
      .theme-riso.dark #splash {
        background: #141416;
      }
      .theme-riso #splash {
        isolation: isolate;
      }
      .theme-riso #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("/styles/grain.svg");
        background-repeat: repeat;
        background-size: 182px;
        pointer-events: none;
        z-index: 1;
      }
      .theme-riso.light #splash::before {
        opacity: 0.03;
      }
      .theme-riso.dark #splash::before {
        opacity: 0.12;
      }
      .theme-riso #splash-logo {
        border-radius: 20px;
        box-shadow: 0 4px 16px rgba(60, 40, 20, 0.3);
      }
      .theme-riso.light #splash-name {
        color: #0a0a0a;
      }
      .theme-riso.dark #splash-name {
        color: #f2ede4;
      }

      /* --- Frutiger Aero theme --- */
      .theme-frutiger.light #splash {
        background: linear-gradient(
          145deg,
          #48b0d8 0%,
          #70c8e8 12%,
          #90d8f0 28%,
          #b0e4f6 45%,
          #a8e0e8 58%,
          #98e0d0 72%,
          #b0e8c8 85%,
          #c8f0d0 100%
        );
      }
      .theme-frutiger.dark #splash {
        background: linear-gradient(
          145deg,
          #020a14 0%,
          #061220 18%,
          #0a1a30 40%,
          #0c2038 60%,
          #081830 80%,
          #061220 100%
        );
      }
      .theme-frutiger #splash-logo {
        border-radius: 1.75rem 2rem 1.5rem 1.75rem;
      }
      .theme-frutiger.light #splash-logo {
        box-shadow:
          0 6px 20px rgba(0, 80, 140, 0.25),
          0 2px 6px rgba(0, 60, 110, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      .theme-frutiger.dark #splash-logo {
        box-shadow:
          0 6px 20px rgba(0, 0, 0, 0.4),
          0 2px 6px rgba(0, 40, 80, 0.3),
          inset 0 1px 0 rgba(80, 160, 230, 0.15);
      }
      .theme-frutiger.light #splash-name {
        color: #0c2840;
      }
      .theme-frutiger.dark #splash-name {
        color: #c0daf0;
      }

      /* --- Brutalist theme --- */
      .theme-brutalist.light #splash {
        background: #d8d4ce;
      }
      .theme-brutalist.dark #splash {
        background: #141414;
      }
      .theme-brutalist #splash-logo {
        border-radius: 0;
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
      }
      .theme-brutalist.light #splash-logo {
        border: 1px solid #1a1a1a;
      }
      .theme-brutalist.dark #splash-logo {
        border: 1px solid #c8c4be;
      }
      .theme-brutalist #splash-name {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }
      .theme-brutalist.light #splash-name {
        color: #1a1a1a;
      }
      .theme-brutalist.dark #splash-name {
        color: #c8c4be;
      }

      /* --- Cupertino theme --- */
      .theme-cupertino.light #splash {
        background: #f2f2f7;
      }
      .theme-cupertino.dark #splash {
        background: #000000;
      }
      .theme-cupertino #splash-logo {
        border-radius: 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }

      /* --- Prism theme --- */
      .theme-prism.light #splash {
        background:
          radial-gradient(
            ellipse 60% 50% at 15% 20%,
            color-mix(in srgb, var(--brand-primary, #636366) 20%, transparent)
              0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 50% 45% at 85% 60%,
            color-mix(
                in srgb,
                var(--brand-accent, var(--brand-primary, #636366)) 16%,
                transparent
              )
              0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 35% at 50% 90%,
            color-mix(in srgb, var(--brand-primary, #636366) 10%, transparent)
              0%,
            transparent 70%
          ),
          #f2f2f7;
      }
      .theme-prism.dark #splash {
        background:
          radial-gradient(
            ellipse 60% 50% at 15% 20%,
            color-mix(in srgb, var(--brand-primary, #636366) 18%, transparent)
              0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 50% 45% at 85% 60%,
            color-mix(
                in srgb,
                var(--brand-accent, var(--brand-primary, #636366)) 14%,
                transparent
              )
              0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 35% at 50% 90%,
            color-mix(in srgb, var(--brand-primary, #636366) 8%, transparent) 0%,
            transparent 70%
          ),
          #000000;
      }
      .theme-prism #splash-logo {
        border-radius: 20px;
      }
      .theme-prism.light #splash-logo {
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.12),
          0 0 24px
            color-mix(in srgb, var(--brand-primary, #636366) 15%, transparent);
      }
      .theme-prism.dark #splash-logo {
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.4),
          0 0 24px
            color-mix(in srgb, var(--brand-primary, #636366) 20%, transparent);
      }
    </style>
    <div id="splash" aria-hidden="true">
      <img id="splash-logo" alt="" width="96" height="96" />
      <span id="splash-name">CARE-Y</span>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
