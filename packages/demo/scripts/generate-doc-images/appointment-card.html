<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Appointment card mockup</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 800px;
        background: #eef1f4;
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #24313f;
        position: relative;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 60px;
        background: #ffffff;
        border-radius: 18px;
        border: 1px solid #ccd6e0;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        padding: 56px 70px;
      }
      .tag {
        display: inline-block;
        background: #a33;
        color: #fff;
        font-size: 20px;
        letter-spacing: 4px;
        padding: 10px 22px;
        border-radius: 8px;
        margin-bottom: 30px;
      }
      h1 {
        font-size: 44px;
        margin-bottom: 36px;
      }
      .row {
        display: flex;
        font-size: 26px;
        line-height: 2.1;
      }
      .row b {
        width: 260px;
        color: #5b6b7b;
        font-weight: 600;
      }
      .note {
        margin-top: 36px;
        font-size: 21px;
        line-height: 1.6;
        color: #5b6b7b;
        border-top: 1px solid #ccd6e0;
        padding-top: 24px;
      }
      .watermark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .watermark span {
        font-size: 170px;
        font-weight: 800;
        letter-spacing: 20px;
        color: rgba(170, 51, 51, 0.13);
        transform: rotate(-25deg);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">EXAMPLE</div>
      <h1>Appointment Reminder</h1>
      <div class="row"><b>For:</b> <span>A. Example</span></div>
      <div class="row">
        <b>Location:</b> <span>Example Center, Room 0</span>
      </div>
      <div class="row"><b>Date:</b> <span>99/99/9999 at 00:00</span></div>
      <div class="row"><b>Confirmation:</b> <span>0000-EXAMPLE</span></div>
      <div class="note">
        This card is a fabricated example created for the CARE-Y interactive
        handbook. It refers to no real appointment, place, or person.
      </div>
    </div>
    <div class="watermark"><span>SAMPLE</span></div>
  </body>
</html>
