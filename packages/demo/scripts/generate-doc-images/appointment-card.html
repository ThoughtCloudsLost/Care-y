<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Appointment card mockup</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 800px;
        background: #eef1f4;
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #24313f;
        position: relative;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 60px;
        background: #ffffff;
        border-radius: 18px;
        border: 1px solid #ccd6e0;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        padding: 56px 70px;
      }
      h1 {
        font-size: 44px;
        margin-bottom: 36px;
      }
      .row {
        display: flex;
        font-size: 26px;
        line-height: 2.1;
      }
      .row b {
        width: 260px;
        color: #5b6b7b;
        font-weight: 600;
      }
      .note {
        margin-top: 36px;
        font-size: 21px;
        line-height: 1.6;
        color: #5b6b7b;
        border-top: 1px solid #ccd6e0;
        padding-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Appointment Reminder</h1>
      <div class="row"><b>For:</b> <span>A. Example</span></div>
      <div class="row"><b>Location:</b> <span>Intake Center, Room 0</span></div>
      <div class="row"><b>Date:</b> <span>99/99/9999 at 00:00</span></div>
      <div class="row"><b>Confirmation:</b> <span>0000-EXAMPLE</span></div>
      <div class="note">
        Please arrive 15 minutes early and bring photo identification. Sample
        for demonstration.
      </div>
    </div>
  </body>
</html>
