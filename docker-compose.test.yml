# Test compose override. Targets the "test" Dockerfile stage and bind-mounts
# test infrastructure that .dockerignore (correctly) excludes from production.
#
# Start with watch mode so lockfile changes trigger automatic image rebuilds:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml watch
#
# Then run tests from a second terminal:
#   pnpm test:server:db          (server tests with DB)
#   pnpm test:coverage           (all Docker-compatible projects with coverage)
#
# Client tests run on the host (SvelteKit deps are not in the Docker image):
#   pnpm vitest run --project client

services:
  app:
    build:
      context: .
      target: test
    # Test container is ephemeral and local-only. Relax read_only so
    # bind mounts and vitest can write temp files.
    read_only: false
    volumes:
      # Vitest config (excluded by .dockerignore, needed for test runner)
      - ./vitest.config.ts:/app/vitest.config.ts:ro
      # Source dirs with test files (.dockerignore excludes *.test.ts).
      # Bind-mount the full src dirs so test files are present alongside
      # the source they test. :ro because tests don't write to source.
      - ./packages/server/src:/app/packages/server/src:ro
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./packages/crypto/src:/app/packages/crypto/src:ro
      # OPRF socket volume so integration tests can reach OPRF processes
      - oprf_sockets:/run/oprf
      # Client tests run on the host (SvelteKit deps not in Docker image).
      # Use `pnpm vitest run --project client` locally for client coverage.

volumes:
  oprf_sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=2001,gid=2001
