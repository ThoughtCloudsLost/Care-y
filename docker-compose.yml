# Dev compose. Uses `docker compose watch` for file sync instead of bind mounts.
# This preserves read_only, avoids pnpm symlink conflicts, and matches prod
# container isolation. (SEC-194 through SEC-197)
#
# Usage:
#   docker compose watch          (foreground, watches for file changes)
#   docker compose watch --detach (background)
#   docker compose up -d          (no file sync, just run)

services:
  app:
    build:
      context: .
      target: production
    user: "1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    tmpfs:
      - /tmp
    ports:
      # Bound to loopback by default. Set BIND_ADDR to expose on another
      # interface (e.g. a VPN address) when testing from another device.
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    networks: [internal]
    volumes:
      - oprf_sockets:/run/oprf
      - blob_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      oprf-a:
        condition: service_started
      oprf-b:
        condition: service_started
    env_file: .env
    environment:
      - NODE_ENV=development
      # The E2E suite submits many intakes from one address in a single
      # run. Production keeps the schema default of 3 per hour; this
      # compose file is development and E2E only.
      - INTAKE_SUBMISSION_LIMIT=${INTAKE_SUBMISSION_LIMIT:-500}
      - OPRF_SOCKET_A=/run/oprf/oprf-a.sock
      - OPRF_SOCKET_B=/run/oprf/oprf-b.sock
      - TOTP_REPLAY_BYPASS=1
    develop:
      watch:
        # Source code: sync into container, tsx --watch restarts automatically
        - action: sync
          path: ./packages/server/src
          target: /app/packages/server/src
        - action: sync
          path: ./packages/shared/src
          target: /app/packages/shared/src
        - action: sync
          path: ./packages/crypto/src
          target: /app/packages/crypto/src
        # Config changes: sync + restart the process
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
        - action: sync+restart
          path: ./packages/server/tsconfig.json
          target: /app/packages/server/tsconfig.json
        # Dependency changes: full image rebuild
        - action: rebuild
          path: ./pnpm-lock.yaml

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    # no ports: - DB is NOT reachable from outside the compose network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      # Mailpit has no authentication and its UI exposes every captured
      # message, so it stays on loopback. See BIND_ADDR note on app.
      - "${BIND_ADDR:-127.0.0.1}:1025:1025"
      - "${BIND_ADDR:-127.0.0.1}:8025:8025"
    networks: [internal]
    restart: unless-stopped

  oprf-a:
    build:
      context: .
      dockerfile: Dockerfile.oprf
    user: "2001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.25"
    tmpfs:
      - /tmp
    environment:
      - OPRF_SOCKET_PATH=/run/oprf/oprf-a.sock
      - OPRF_SHARE_HEX=${OPRF_SHARE_A_HEX}
    volumes:
      - oprf_sockets:/run/oprf
    networks: [internal]

  oprf-b:
    build:
      context: .
      dockerfile: Dockerfile.oprf
    user: "2001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.25"
    tmpfs:
      - /tmp
    environment:
      - OPRF_SOCKET_PATH=/run/oprf/oprf-b.sock
      - OPRF_SHARE_HEX=${OPRF_SHARE_B_HEX}
    volumes:
      - oprf_sockets:/run/oprf
    networks: [internal]

volumes:
  postgres_data:
  blob_data:
  oprf_sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=2001,gid=3001,mode=0770

networks:
  internal:
    driver: bridge
