services:
  app:
    build: .
    user: "1001:1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    tmpfs:
      - /tmp
    ports:
      - "3000:3000"
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app # mount source for hot reload (bind mounts are r/w regardless of read_only)
      - /app/node_modules # prevent host node_modules from overwriting container's
    environment:
      - NODE_ENV=development

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    # no ports: - DB is NOT reachable from outside the compose network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
