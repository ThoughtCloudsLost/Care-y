# Git hooks managed by Lefthook
# https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    gitleaks:
      run: gitleaks protect --staged
      skip:
        - run: "! command -v gitleaks &>/dev/null"
    banned-patterns:
      run: if [ -f .githooks/pre-commit ]; then bash .githooks/pre-commit; fi
    typecheck:
      run: npx tsc --build
    lint:
      run: npx eslint packages/
    format:
      run: npx prettier --check --ignore-path .prettierignore --ignore-path .prettierignore.local {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
    banned-patterns:
      run: if [ -f .githooks/commit-msg ]; then bash .githooks/commit-msg {1}; fi
