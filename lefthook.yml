# Git hooks managed by Lefthook
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged
      skip:
        - run: "! command -v gitleaks &>/dev/null"
    banned-patterns:
      run: if [ -f .githooks/pre-commit ]; then bash .githooks/pre-commit; fi
    typecheck-lint:
      # Skipped when nothing staged can affect the type surface
      # (docs-only or asset-only commits).
      # Lint runs after typecheck in the same command: typed eslint reads the
      # declaration and paraglide output that tsc/paraglide rewrite, so running
      # them in parallel makes eslint see half-written types and fail on
      # unresolvable-type errors in arbitrary files.
      glob: "*.{ts,js,mjs,svelte,json}"
      run: |
        if git diff --cached --name-only | grep -q 'messages/.*\.json$'; then
          pnpm run typecheck
        else
          pnpm exec tsc --build && pnpm --filter @care-y/client exec svelte-check --tsconfig ./tsconfig.json
        fi
        lintable=$(git diff --cached --name-only --diff-filter=ACMR | grep -E '\.(ts|js|mjs|svelte)$' || true)
        if [ -n "$lintable" ]; then
          echo "$lintable" | xargs pnpm exec eslint
        fi
    format:
      run: pnpm exec prettier --check --ignore-path .prettierignore --ignore-path .prettierignore.local {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
    banned-patterns:
      run: if [ -f .githooks/commit-msg ]; then bash .githooks/commit-msg {1}; fi
