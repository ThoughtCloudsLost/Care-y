# CARE-Y host log policy. Installed to /etc/systemd/journald.conf.d/ by
# deploy/provision/50-logging.sh. Do not edit the installed copy by hand.
#
# The journal stays on this host and keeps 14 days. Every container logs
# here through Docker's journald driver (docker-compose.prod.yml).
#
# journald deletes only whole archived files, never entries inside the active
# one (journald.conf(5)). MaxFileSec rotates the active file daily so the
# 14-day window holds: with the default of one month, the active file could
# keep a month of entries out of reach of MaxRetentionSec.
#
# SystemMaxUse caps disk use; it is a safety ceiling, not the policy.
# ForwardToSyslog=no keeps container lines out of any syslog daemon's files
# under /var/log, which rotate on their own schedule outside this policy.
[Journal]
Storage=persistent
MaxRetentionSec=14day
MaxFileSec=1day
SystemMaxUse=2G
ForwardToSyslog=no
